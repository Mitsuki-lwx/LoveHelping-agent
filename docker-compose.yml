# ============================================================
# lwx-ai-agent V1 发布编排（2026-09-07）
# 服务：mysql8（主库/业务+flyway）· postgres16+pgvector（RAG 向量库，应用首启自举建表+embedding）
#       · redis7 · mcp-server（工具面独立进程）· app（主应用，含前端静态）
# 使用：cp .env.example .env 填密钥 → docker compose up -d --build → http://localhost:8088/api/
# 密钥全部走 .env（不提交）；本文件只含非敏感编排。
# ============================================================

name: lwx-ai-agent

# 镜像仓库（CD 推送目标；TAG 由 release 流水线注入，服务器部署用 compose pull 拉取）
x-images:
  app: &app-image  ${IMAGE_REGISTRY:-ghcr.io/Mitsuki-lwx/lovehelping}:${TAG:-latest}
  mcp: &mcp-image  ${IMAGE_REGISTRY:-ghcr.io/Mitsuki-lwx/lovehelping-mcp}:${TAG:-latest}

services:
  mysql:
    image: mysql:8.0
    container_name: lai-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: agentdb
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?请在 .env 设置 PGVECTOR_PASSWORD}
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lai-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  mcp-server:
    image: *mcp-image
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: lai-mcp-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    expose:
      - "8125"

  app:
    image: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lai-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # DB / 中间件（容器网络内 host 名）
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      PG_HOST: postgres
      REDIS_HOST: redis
      # 工具面
      MCP_SERVER_URL: http://mcp-server:8125/mcp
      # LLM（主=BigModel 兼容，yml 默认 glm-4-flash；embedding/备=dashscope）
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请在 .env 设置 OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-glm-4-flash}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 .env 设置 DASHSCOPE_API_KEY}
      # 安全
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET（≥32 字符随机串）}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?请在 .env 设置 ADMIN_API_KEY（管理端点 X-Admin-Key）}
      # 可选覆盖
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
    ports:
      - "${APP_PORT:-8088}:8088"

volumes:
  mysql-data:
  pg-data:
