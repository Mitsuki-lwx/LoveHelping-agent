# ============================================================
# lwx-ai-agent V1 发布编排（2026-09-07）
# 服务：mysql8（主库/业务+flyway）· postgres16+pgvector（RAG 向量库，应用首启自举建表+embedding）
#       · redis7 · mcp-server（工具面独立进程）· app（主应用，含前端静态）
# 使用：cp .env.example .env 填密钥 → docker compose up -d --build → http://localhost:8088/api/
# 密钥全部走 .env（不提交）；本文件只含非敏感编排。
# ============================================================

name: lwx-ai-agent

# 镜像仓库（CD 推送目标；TAG 由 release 流水线注入，服务器部署用 compose pull 拉取）
x-images:
  app: &app-image  ${IMAGE_REGISTRY:-ghcr.io/Mitsuki-lwx/lovehelping}:${TAG:-latest}
  mcp: &mcp-image  ${IMAGE_REGISTRY:-ghcr.io/Mitsuki-lwx/lovehelping-mcp}:${TAG:-latest}

services:
  mysql:
    image: mysql:8.0
    container_name: lai-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: agentdb
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?请在 .env 设置 PGVECTOR_PASSWORD}
      POSTGRES_DB: postgres
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lai-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  mcp-server:
    image: *mcp-image
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: lai-mcp-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # MCP 的联网搜索工具（不填则该工具不可用，不阻断启动）
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      # MCP 的图片搜索工具（Pexels；同上）
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    expose:
      - "8125"

  app:
    image: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lai-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      # DB / 中间件（容器网络内 host 名）
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      PG_HOST: postgres
      REDIS_HOST: redis
      # 工具面
      MCP_SERVER_URL: http://mcp-server:8125/mcp
      # ---- LLM 主链（ADR-58：供应商在 app.llm.providers 声明；主链 = DeepSeek 官方 deepseek-flash）----
      # ⛔ 2026-10-13 修正：原默认 glm-4-flash + bigmodel 端点（ADR-51 已实测 400）会让生产直接跑挂；
      #    dashscope 自 2026-09-16 起 TLS 中断已停用（ADR-51），不再强制要求它的 key。
      OPENAI_API_KEY: ${OPENAI_API_KEY:?请在 .env 设置 OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-flash}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      # ---- embedding + 远端 rerank（ADR-45/41：硅基流动；⛔ 缺了 RAG 检索全废）----
      SF_API_KEY: ${SF_API_KEY:?请在 .env 设置 SF_API_KEY（embedding/rerank）}
      # ---- 邮件（ADR-84：prod 未配置 SMTP 会**拒绝启动**，故必须传）----
      MAIL_HOST: ${MAIL_HOST:?请在 .env 设置 MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:?请在 .env 设置 MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?请在 .env 设置 MAIL_PASSWORD（SMTP 授权码，不是登录密码）}
      MAIL_FROM: ${MAIL_FROM:?请在 .env 设置 MAIL_FROM}
      # 安全
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET（≥32 字符随机串）}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?请在 .env 设置 ADMIN_API_KEY（管理端点 X-Admin-Key）}
      # ---- 可选（不填则对应能力关闭/降级，不阻断启动）----
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}          # MCP 联网搜索工具
      CLINE_API_KEY: ${CLINE_API_KEY:-}            # 第二 provider（ADR-58，需同时在 providers 里启用）
      JEV_API_KEY: ${JEV_API_KEY:-}                # 窄结构化判定（ADR-36/38，默认关）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}    # 仅回滚用（ADR-51 已停用）
    ports:
      - "${APP_PORT:-8088}:8088"

volumes:
  mysql-data:
  pg-data:
