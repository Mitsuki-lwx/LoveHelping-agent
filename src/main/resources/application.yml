# ============================================================================
# LWX AI Agent 主配置文件
# ============================================================================
# 本文件定义了整个 Spring Boot 应用的全局配置，包括：
#   - 数据库连接（MySQL + PostgreSQL/pgvector）
#   - AI 模型（DeepSeek、DashScope、OpenAI）
#   - Redis 缓存
#   - RAG 检索系统（Elasticsearch + Milvus 混合检索）
#   - 进化系统（技能自动演化）
#   - JWT 认证
#   - API 文档（Knife4j/Swagger）
# ============================================================================

spring:
  application:
    name: lwx-ai-agent

  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration  # 应用名称（注册到服务发现/监控时使用）

  # 激活的配置 profile —— 默认 local（开发）；容器/生产由 SPRING_PROFILES_ACTIVE=prod 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ======================== MySQL 主数据源 ========================
  # 存储用户、知识条目、投票记录、技能等业务数据
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL JDBC 驱动（cj 版本支持 MySQL 8.x）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/agentdb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # URL 参数说明：
    #   useUnicode=true            —— 启用 Unicode 字符集
    #   characterEncoding=utf-8    —— 使用 UTF-8 编码（支持中文）
    #   useSSL=false               —— 本地开发关闭 SSL（生产环境应开启）
    #   serverTimezone=Asia/Shanghai —— 时区设为东八区（北京时间）
    #   allowPublicKeyRetrieval=true —— 允许客户端从服务器获取公钥以进行加密连接
    username: root
    password: ${MYSQL_PASSWORD:}  # 从环境变量读取密码，未设置则默认为空

  # Flyway 接管 DDL（docs/04 §5：禁止再改 schema.sql，新变更一律加 V{n}__*.sql）
  # baseline-on-migrate：已存在表的历史库自动打基线（跳过 V1），空库则执行全部迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: never             # schema.sql 机制停用，DDL 只经 Flyway
      continue-on-error: true # 初始化出错时不中断启动（如表已存在时报错忽略）

  # ======================== Spring AI 配置 ========================
  ai:
    # ADR-23: LlmGateway is the only retry owner (no SDK x gateway multiplication).
    retry:
      max-attempts: 1
    chat:
      observations:
        log-prompt: false
        log-completion: false
    # 对话记忆（Phase 2 消息落库后）已迁移至自建 message 表（MessageChatMemory），
    # 不再使用 Spring AI JDBC ChatMemory（SPRING_AI_CHAT_MEMORY 已废弃）。

    # MCP（Model Context Protocol）客户端配置
    # Streamable HTTP 连接：mcp-server 独立进程（端口 8125），主应用经 HTTP 调用。
    # 说明：MCP 规范中 SSE 传输已弃用（2025-03 规范，官方以 Streamable HTTP 取代），
    # Spring AI 1.1.7 的 mcp-server 同时暴露 /sse 与 /mcp，本端使用标准 /mcp。
    # 独立部署收益：mcp-server 独立进程，不随主应用拉起（密钥/生命周期/扩缩容独立）。
    mcp:
      client:
        enabled: true                    # 1.1.8 需显式开启 MCP client（工具面恢复）
        streamable-http:                 # 1.1.8 Streamable HTTP 配置前缀（非 http.connections）
          connections:
            # 自研 MCP Server（独立进程，Streamable HTTP）：搜索/天气/图片/网页抓取/约会方案
            lwx-agent-mcp:
              # 2026-09-07 发布化：host 可由 MCP_SERVER_URL 覆盖（compose 内=http://mcp-server:8125/mcp）
              url: ${MCP_SERVER_URL:http://localhost:8125/mcp}
        # amap-maps（高德地图）暂停：npx stdio 模式无法独立部署（会随主应用拉起并可能拖死启动），
        # 待确认其 SSE 支持后恢复（ADR-2 原则：工具面故障不放大为应用故障）。
        # stdio:
        #   connections:
        #     amap-maps:
        #       command: npx.cmd
        #       args:
        #         - "-y"
        #         - "@amap/amap-maps-mcp-server@latest"
        #       env:
        #         AMAP_MAPS_API_KEY: "${amap.api-key}"

    # 阿里云 DashScope API（通义千问等模型的 SDK 封装）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}  # 从环境变量读取 API Key

    # DeepSeek API（禁用：当前仅使用 sensenova OpenAI 兼容端点，非 DeepSeek）
    deepseek:
      enabled: false
      api-key: ${DEEPSEEK_API_KEY:}   # 从环境变量读取 API Key

    # OpenAI 兼容接口（LlmGateway 主供应商，ADR-7）
    # 当前使用 sensenova 通用 OpenAI 兼容端点
    openai:
      base-url: ${OPENAI_BASE_URL:https://token.sensenova.cn}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
      # 禁用 OpenAI embedding/多模态自动配置：嵌入仍用 DashScope（待调研后替换），
      # 避免 openAiEmbeddingModel 与 dashscopeEmbeddingModel 的 @Primary 冲突
      embedding:
        enabled: false
      image:
        enabled: false
      audio:
        enabled: false

  # ======================== Redis 配置 ========================
  # 用于缓存、会话管理、限流计数等
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # Redis 服务器地址
      port: ${REDIS_PORT:6379}        # Redis 端口
      timeout: 3000ms                 # 连接超时时间（3秒）

# ======================== 监控与链路追踪 ========================
# Spring Boot Actuator + Micrometer Tracing
sentry:
  dsn: ${SENTRY_DSN:}    # 错误追踪（2026-09-07）：空=不初始化；填 DSN 即启用自动上报

management:
  otlp:
    tracing:
      export:
        enabled: false # Only the bounded Langfuse exporter is used (ADR-24).
  tracing:
    enabled: true                # 启用链路追踪
    sampling:
      probability: 1.0           # 采样率 100%（全部请求都追踪，方便调试）
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # 暴露 Prometheus 指标端点（llm.tokens 等，08 §2.2）
  prometheus:
    metrics:
      export:
        enabled: true

# ======================== 应用自定义配置 ========================
app:
  # 在线并发闸门（性能工程，2026-09-07 定案；2026-09-15 实测复核，Phase 6 / ADR-29）。
  # 修正：旧注释称"厂商 ≥40 零 429（无硬限流）"与实测不符——那是**经过本应用**测得的结果，
  # 而应用的闸门恰好是 24，把真实并发压住了。直连上游阶梯探测（绕过应用）实测：
  #   ≤16 全通；32 → 7~10/32 得 429；64 → 37~38/64；96 → 73/96（超额立即 429，不排队）。
  #   → 厂商有效并发上限 ≈ 24，这就是真正的吞吐天花板；调高内部阈值只会把压力透传成 429。
  # ======================== 日志降噪（ADR-33）========================
  # 上游（DashScope 等）不可达时，若干第三方 logger 每次失败都打完整堆栈：
  # 实测 30 分钟产出 1.78 GB（1.91 GB 文件 / 1600 万行，堆栈行占 93.9%），≈3.6 GB/h，
  # 长时上游故障会打满磁盘。而同一失败我们已在入口层处理（SSE error 事件 / 降级日志 /
  # Prometheus 指标），故只对这些"已知重复噪音"按时间窗限流。
  #   → 白名单内每 window-ms 最多放行 max-per-window 条（含完整堆栈），其余丢弃；
  #     窗口结束输出一条汇总（logger=app.log.throttled，含被抑制条数）——排障信息不丢。
  #   → 白名单之外的日志完全不受影响。
  # 一键回退：enabled=false（或删除 src/main/resources/logback-spring.xml）。
  logging:
    throttle:
      enabled: ${LOG_THROTTLE_ENABLED:true}
      window-ms: ${LOG_THROTTLE_WINDOW_MS:10000}
      max-per-window: ${LOG_THROTTLE_MAX_PER_WINDOW:3}
      # 逗号分隔的 logger 白名单（与 logback-spring.xml 的默认值保持一致）
      loggers: org.springframework.ai.chat.model.MessageAggregator,org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration,com.alibaba.cloud.ai.dashscope.embedding.DashScopeEmbeddingModel

  # 闸门只限"在途模型请求"——真实在线用户数远高于此（多数时间在阅读/输入）。
  online:
    max-inflight: ${ONLINE_MAX_INFLIGHT:24}
    # 有界排队（ADR-29）：闸门满时最多等这么久，腾出额度即放行；到点仍无额度则明确拒绝。
    # 设 0 可关闭排队（退化为立即拒绝）。
    wait-ms: ${ONLINE_WAIT_MS:3000}
    # 等待者上限：超出即立即拒绝，避免无界堆积占用容器线程。
    queue-capacity: ${ONLINE_QUEUE_CAPACITY:24}
  graph:
    executor:
      core-size: 24
      max-size: 24
      queue-capacity: 0
  chat:
    timeout-ms: 90000
    provider: deepseek           # 默认聊天模型提供商（历史配置，主备结构见 app.llm）

  # LlmGateway 配置（ADR-7）：当前仅使用 sensenova OpenAI 兼容端点
  llm:
    max-concurrent-calls: ${LLM_MAX_CONCURRENT_CALLS:24}
    connect-timeout-ms: 3000
    attempt-timeout-ms: 25000
    total-timeout-ms: 60000
    stream-idle-timeout-ms: 15000
    retry:
      max-attempts: 3
      backoff-ms: 250
      max-backoff-ms: 5000
      jitter: 0.5
      budget-per-minute: 30
    # ADR-32：熔断按"滑窗失败率"判定（原连续 N 次计数已删除——它把厂商个位数百分比的
    # 背景拒绝经重试放大成 15s 全量降级）。50 次窗口 + 20 个样本起判 + 50% 阈值，
    # 与 Resilience4j 默认形状一致：噪声（<10%）判不开，真故障（≈100%）立刻开。
    circuit:
      enabled: true
      open-ms: 15000
      max-open-ms: 60000
      sliding-window-size: 50
      minimum-number-of-calls: 20
      failure-rate-threshold: 0.5
      half-open-probes: 3
    # ADR-32：厂商并发上限会漂移（实测 16~28），闸门不再硬编码在实测值上，改为 AIMD 自收敛。
    # 收到限流（429/厂商限流码）乘性收缩，连续成功 20 次加性回升 1，区间 [min, max-concurrent-calls]。
    adaptive:
      enabled: ${LLM_ADAPTIVE_ENABLED:true}
      min-concurrent-calls: 4
      decrease-factor: 0.7
      increase-after-successes: 20
    fallback-enabled: ${LLM_FALLBACK_ENABLED:false}
    # 视觉模型（ADR-11）：基于 GoPlan 端点换 model 即多模态；未配置则图片聊天不可用
    vision-model: mimo-v2.5

  # RAG 查询改写开关（ADR-15）：开启时检索前用 LLM 改写用户查询（每轮多一次 LLM 调用）。
  # 2026-09-04 评测实锤：改写劣化严重（"冷战筑墙怎么办"被压成"吵架"、关键实体丢失、
  # 偶发注入猜测词）→ 默认关闭，用原始 query 检索（诊断：原始 query 目标文档在 top5 内）
  # 2026-09-20：补环境变量覆盖（QUERY_REWRITE_ENABLED），使"开/关"是运行时决策而非改源码，
  # 便于对照实验；默认值不变（仍 false）。
  rag:
    # Phase 8（ADR-36）：embedding 提供方。siliconflow（默认）= 硅基流动 Qwen3-Embedding-0.6B；
    # dashscope = 回滚到旧通道。切换只改此值 + 重启，需同步重建向量（两模型向量空间不通用）。
    embedding:
      provider: ${RAG_EMBEDDING_PROVIDER:siliconflow}
    query-rewrite:
      enabled: ${QUERY_REWRITE_ENABLED:false}
    # 混合召回（向量 + jieba 分词关键词 LIKE → RRF 融合，2026-09-04 开启）：
    # extractKeywords 已修复为 jieba 查询端分词逐词 LIKE（原整句 LIKE 空转→hybrid 退化），
    # trgm GIN 索引已就绪——keyword 通道有料可融，RRF 把双通道命中的目标提前
    hybrid-search:
      enabled: true
    # 向量粗召回数（默认 8）：top5 去重后父文档常不足；8 对 Recall 更稳（9/4 实测 Recall 1.00）
    top-k: 8
    # ADR-25: free local CPU cross-encoder. Start ops/reranker before enabling.
    # No extra embedding calls are made for logging.
    # Phase 8（ADR-36）：rerank 增加 mode=remote（硅基流动 Qwen3-Reranker-8B）。
    # 注意 timeout-ms 由 2000 提到 5000：实测 8B 偶发 3.97s，2000 会误杀正常请求。
    #
    # 2026-09-21（ADR-39）：**默认改为 enabled=true / mode=remote**。
    #   依据：45 例三轮 MRR 0.751 → 0.856（**+0.105**），远超实测噪声带 0.012 且三轮同向；
    #         Recall 不变（重排只改排序、不改召回集合）。
    #   代价：每次检索多一次外部调用（热态 ~0.4s；⚠️ 冷启动首调用观测到 5.21s，> timeout-ms）。
    #   ⚠️ remote 需要 SF_API_KEY，但**缺 key 不会导致启动失败**——
    #      密钥校验在**调用期**（与 SiliconFlowEmbeddingModel 的姿势一致），
    #      抛出后被 RerankDocumentPostProcessor 捕获 → 降级为原顺序 → 对话不受影响。
    #   回滚：RERANK_ENABLED=false；或 RERANK_MODE=local 并启动 ops/reranker。
    rerank:
      enabled: ${RERANK_ENABLED:true}
      mode: ${RERANK_MODE:remote}
      url: ${RERANK_URL:https://api.siliconflow.cn/v1/rerank}
      model: ${RERANK_MODEL:Qwen/Qwen3-Reranker-8B}
      top-n: 20
      top-k: 5
      max-candidate-chars: 1000
      timeout-ms: 5000
      connect-timeout-ms: 500
      max-concurrent: 2
      failure-threshold: 3
      circuit-open-ms: 15000

  # 硅基流动（SiliconFlow）：Phase 8 新增的 embedding / rerank 通道（ADR-36）。
  # 密钥只走环境变量 SF_API_KEY，禁止落盘。
  # 维度约束：Qwen3-Embedding-0.6B = 1024 维，与现有 vector_store.embedding vector(1024) 兼容；
  # 4B/8B 为 2560/4096 维，切换必须连表一起重建，不要手改此值。
  siliconflow:
    api-key: ${SF_API_KEY:}
    base-url: ${SF_BASE_URL:https://api.siliconflow.cn}
    embedding-model: ${SF_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-0.6B}
    rerank-model: ${SF_RERANK_MODEL:Qwen/Qwen3-Reranker-8B}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    max-batch-size: 32

  # Langfuse 可观测（手写 2.x 签名接入，参考 CodeForge）：密钥一律环境变量注入
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    host: ${LANGFUSE_HOST:http://localhost:3000}
    max-queue-size: 2048
    max-batch-size: 256
    schedule-delay-ms: 1000
    timeout-ms: 3000

  # ======================== Jev（TypeSafe AI / System One）========================
  # 只用于"窄的结构化判定"（官方定位：代码拥有流程，AI 只做窄判定）。
  # 默认关闭；关闭时行为与接入前完全一致。打开需同时给 JEV_ENABLED + JEV_API_KEY。
  jev:
    enabled: ${JEV_ENABLED:false}
    api-key: ${JEV_API_KEY:}          # 只走环境变量，禁止写入配置文件（AGENTS.md §3）
    base-url: ${JEV_BASE_URL:https://api.typesafe.ai}
    model: ${JEV_MODEL:jev-latest}
    timeout-ms: 3000                  # 故意设短：失败就回退，不许拖慢请求
    guardrail:
      # 护栏口语化危机"加召回"：只升级、不放行，词典仍是唯一兜底（详见 docs/phase7-guardrail-recall）
      # mode 三态（docs/phase7-jev-shadow）：
      #   off     = 不调用，行为等于接入前（默认）
      #   shadow  = 判定并落库 action=SHADOW，**绝不改变响应**；用来量真实分布与误报率
      #   enforce = 判定 + 越阈值拦截（抛 4001 转介文案）
      mode: ${JEV_GUARDRAIL_MODE:off}
      min-probability: 0.6            # 标定值（0.3~0.6 召回 8/8 且误报 0；0.9 只剩 3/8）

  # 编排图能力治理（ADR-19）：agent 节点工具白名单（能力域，逗号分隔）
  orchestration:
    tools:
      agent-allowlist: terminate,retrieval,web,image,weather,date   # 放行 收尾+知识/网络/图片/天气/日期；pdf/download 等副作用面排除
  # 消息加密（ADR-4，Phase 3）：AES-256-GCM 透明加密，主密钥由 APP_MESSAGE_KEY 注入
  encryption:
    enabled: true

  # 情绪刹车片（FR-CORE-02，Phase 4）
  emotion-brake:
    enabled: true
    start-hour: 23
    end-hour: 6

  # 后台调度预算（ADR-20）：后台任务不得与在线请求争抢 LLM 配额。
  # 2026-09-01 实测：后台调度 20 分钟产生 95 次 LLM/embedding 调用（在线仅 1 次），
  # 是 429 与监控刷屏的主因。排查/压测时 master-enabled=false 一键静默。
  # 输出层（2026-09-02）：用户可见流的事件白名单与思考过程策略。
  # reasoning-mode=discard（默认）：思考模型的 reasoning 不发给用户（防推理糊脸）；
  # stream：以 §R§ 前缀行发出（前端按前缀折叠展示为"思考过程"）。
  output:
    reasoning-mode: discard
  scheduler:
    master-enabled: true            # 总开关：false 时所有后台调度跳过
    llm-budget-per-minute: 30       # 每分钟后台共享配额（LLM+embedding 调用数，进程内令牌桶）
    max-run-ms: 60000               # 单轮最长执行时间：超出即结束，剩余候选留待下轮
    idle-backoff:
      threshold: 3                  # 连续 N 轮无候选后开始退避
      max-multiplier: 8             # 退避倍数封顶（x2→x4→x8）
    reflect:                        # 技能反思（ReflectionScheduler）
      enabled: true
      fixed-delay-ms: 300000        # 原硬编码 5 分钟
      batch-limit: 20               # 原硬编码 LIMIT 20
    extract:                        # 记忆萃取（MemoryExtractionScheduler）
      enabled: true
      fixed-delay-ms: 1800000       # 原硬编码 30 分钟
      batch-limit: 10               # 原 BATCH_LIMIT 常量

  # 灰度发布（08 §3）：固定百分位桶，userId hashCode % 100 映射
  # 环境变量 CANARY_PERCENTAGE 覆盖，0=不灰度，100=全量新版本
  canary:
    percentage: 0

  # pgvector 向量数据库配置（用于 RAG 的向量存储和相似度检索）
  pgvector:
    datasource:
      driver-class-name: org.postgresql.Driver        # PostgreSQL JDBC 驱动
      url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/postgres   # PostgreSQL 连接地址
      username: postgres
      password: ${PGVECTOR_PASSWORD:}                  # 从环境变量读取

  # 速率限制配置（防止用户频繁调用 API）
  rate-limit:
    enabled: ${DAILY_QUOTA_ENABLED:false} # Daily entitlement remains opt-in.
    daily-quota: 5
    burst-enabled: ${BURST_LIMIT_ENABLED:true}
    burst-capacity: 8
    refill-per-second: 1.0
    max-local-buckets: 10000
    redis-cooldown-ms: 5000

  # 对话记忆配置
  memory:
    window-size: 20              # 每次加载的历史消息数量（用于 LLM 上下文窗口控制）
    agent-window-size: 50        # Agent 执行时保留的最大消息数
    strategy: MESSAGE            # 持久化策略：MESSAGE（自建 message 表，Phase 2 真源）
    prompt-version: v1           # System Prompt 版本（随消息落库归因，08 §2.4）

# ======================== Web 服务器配置 ========================
server:
  port: 8088                     # 应用监听端口
  servlet:
    context-path: /api           # 所有 API 的统一前缀（例如 /api/user/login）

# ======================== API 文档配置（Knife4j + SpringDoc） ========================
springdoc:
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI 的访问路径
    tags-sorter: alpha           # 按字母顺序排列 API 分组
    operations-sorter: alpha     # 按字母顺序排列 API 操作
  api-docs:
    path: /v3/api-docs           # OpenAPI 文档 JSON 的访问路径
  group-configs:
    - group: 'default'
      paths-to-match: '/**'      # 生成所有路径的文档
      packages-to-scan: cn.lwx.lwxaiagent.controller  # 只扫描 Controller 包

knife4j:
  enable: true                   # 启用 Knife4j 增强 Swagger UI
  setting:
    language: zh_cn              # Knife4j UI 显示语言为简体中文

# ======================== 日志配置 ========================
logging:
  level:
    # Spring AI 的 SimpleLoggerAdvisor 输出 DEBUG 级别日志
    # 可以看到每次 LLM 调用的请求和响应内容
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: OFF

# ======================== RAG 检索系统配置 ========================
# 检索模式：pgvector（ADR-1 收敛后唯一路径；Milvus + ES 混合检索已移除）
rag:
  type: pgvector

# ======================== 进化系统配置 ========================
# 技能自动演化：从对话中提取优质经验，沉淀为可复用的技能
evolution:
  enabled: true                  # 是否启用进化系统
  idle-timeout-seconds: 7200     # 会话空闲超时时间（2小时），超时后触发反思
  quality-threshold: 5           # 质量阈值：用户评分 >= 此值才会被进化为技能
  extract-delay-seconds: 1800    # 技能提取延迟（30分钟），保证对话内容足够丰富
  skill-top-k: 3                 # 每次检索返回的 Top-K 个最相关技能
  skill-min-score: 0.5           # 技能检索的最低相似度阈值

# ======================== 搜索 API 配置 ========================
# 通用搜索 API Key（如百度搜索、Google Search 等）
search-api:
  api-key: ${SEARCH_API_KEY:}

# 高德地图 API Key（经 MCP 客户端注入给 amap-maps-server）
amap:
  api-key: ${AMAP_MAPS_API_KEY:}

# ======================== MyBatis-Plus 配置 ========================
mybatis-plus:
  configuration:
    # 日志输出使用 SLF4J（会将 SQL 语句打印到日志中，方便调试）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ======================== JWT 配置（多租户认证） ========================
jwt:
  secret: ${JWT_SECRET:}         # JWT 签名密钥（从环境变量读取，必须保密）
  expiration-ms: 86400000        # Token 过期时间：24 小时（24 * 60 * 60 * 1000）

# ======================== 管理端凭证 ========================
# 用于保护管理类接口（/tenant/token 签发、/memory/admin/**）。
# 未配置时管理接口直接拒绝访问（fail-closed），生产环境必须通过 ADMIN_API_KEY 注入。
admin:
  api-key: ${ADMIN_API_KEY:}
