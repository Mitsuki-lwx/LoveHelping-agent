# ============================================================================
# LWX AI Agent 主配置文件
# ============================================================================
# 本文件定义了整个 Spring Boot 应用的全局配置，包括：
#   - 数据库连接（MySQL + PostgreSQL/pgvector）
#   - AI 模型（DeepSeek、DashScope、OpenAI）
#   - Redis 缓存
#   - RAG 检索系统（Elasticsearch + Milvus 混合检索）
#   - 进化系统（技能自动演化）
#   - JWT 认证
#   - API 文档（Knife4j/Swagger）
# ============================================================================

spring:
  application:
    name: lwx-ai-agent

  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration  # 应用名称（注册到服务发现/监控时使用）

  # 激活的配置 profile —— 指向 application-local.yml（本地开发环境配置）
  profiles:
    active: local

  # ======================== MySQL 主数据源 ========================
  # 存储用户、知识条目、投票记录、技能等业务数据
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL JDBC 驱动（cj 版本支持 MySQL 8.x）
    url: jdbc:mysql://localhost:3306/agentdb?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # URL 参数说明：
    #   useUnicode=true            —— 启用 Unicode 字符集
    #   characterEncoding=utf-8    —— 使用 UTF-8 编码（支持中文）
    #   useSSL=false               —— 本地开发关闭 SSL（生产环境应开启）
    #   serverTimezone=Asia/Shanghai —— 时区设为东八区（北京时间）
    #   allowPublicKeyRetrieval=true —— 允许客户端从服务器获取公钥以进行加密连接
    username: root
    password: ${MYSQL_PASSWORD:}  # 从环境变量读取密码，未设置则默认为空

  # Flyway 接管 DDL（docs/04 §5：禁止再改 schema.sql，新变更一律加 V{n}__*.sql）
  # baseline-on-migrate：已存在表的历史库自动打基线（跳过 V1），空库则执行全部迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: never             # schema.sql 机制停用，DDL 只经 Flyway
      continue-on-error: true # 初始化出错时不中断启动（如表已存在时报错忽略）

  # ======================== Spring AI 配置 ========================
  ai:
    # 对话记忆（Phase 2 消息落库后）已迁移至自建 message 表（MessageChatMemory），
    # 不再使用 Spring AI JDBC ChatMemory（SPRING_AI_CHAT_MEMORY 已废弃）。

    # MCP（Model Context Protocol）客户端配置
    # Streamable HTTP 连接：mcp-server 独立进程（端口 8125），主应用经 HTTP 调用。
    # 说明：MCP 规范中 SSE 传输已弃用（2025-03 规范，官方以 Streamable HTTP 取代），
    # Spring AI 1.1.7 的 mcp-server 同时暴露 /sse 与 /mcp，本端使用标准 /mcp。
    # 独立部署收益：mcp-server 独立进程，不随主应用拉起（密钥/生命周期/扩缩容独立）。
    mcp:
      client:
        enabled: true                    # 1.1.8 需显式开启 MCP client（工具面恢复）
        streamable-http:                 # 1.1.8 Streamable HTTP 配置前缀（非 http.connections）
          connections:
            # 自研 MCP Server（独立进程，Streamable HTTP）：搜索/天气/图片/网页抓取/约会方案
            lwx-agent-mcp:
              url: http://localhost:8125/mcp
        # amap-maps（高德地图）暂停：npx stdio 模式无法独立部署（会随主应用拉起并可能拖死启动），
        # 待确认其 SSE 支持后恢复（ADR-2 原则：工具面故障不放大为应用故障）。
        # stdio:
        #   connections:
        #     amap-maps:
        #       command: npx.cmd
        #       args:
        #         - "-y"
        #         - "@amap/amap-maps-mcp-server@latest"
        #       env:
        #         AMAP_MAPS_API_KEY: "${amap.api-key}"

    # 阿里云 DashScope API（通义千问等模型的 SDK 封装）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}  # 从环境变量读取 API Key

    # DeepSeek API（禁用：当前仅使用 sensenova OpenAI 兼容端点，非 DeepSeek）
    deepseek:
      enabled: false
      api-key: ${DEEPSEEK_API_KEY:}   # 从环境变量读取 API Key

    # OpenAI 兼容接口（LlmGateway 主供应商，ADR-7）
    # 当前使用 sensenova 通用 OpenAI 兼容端点
    openai:
      base-url: ${OPENAI_BASE_URL:https://token.sensenova.cn}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
      # 禁用 OpenAI embedding/多模态自动配置：嵌入仍用 DashScope（待调研后替换），
      # 避免 openAiEmbeddingModel 与 dashscopeEmbeddingModel 的 @Primary 冲突
      embedding:
        enabled: false
      image:
        enabled: false
      audio:
        enabled: false

  # ======================== Redis 配置 ========================
  # 用于缓存、会话管理、限流计数等
  data:
    redis:
      host: ${REDIS_HOST:localhost}   # Redis 服务器地址
      port: ${REDIS_PORT:6379}        # Redis 端口
      timeout: 3000ms                 # 连接超时时间（3秒）

# ======================== 监控与链路追踪 ========================
# Spring Boot Actuator + Micrometer Tracing
management:
  tracing:
    enabled: true                # 启用链路追踪
    sampling:
      probability: 1.0           # 采样率 100%（全部请求都追踪，方便调试）
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # 暴露 Prometheus 指标端点（llm.tokens 等，08 §2.2）
  prometheus:
    metrics:
      export:
        enabled: true

# ======================== 应用自定义配置 ========================
app:
  chat:
    provider: deepseek           # 默认聊天模型提供商（历史配置，主备结构见 app.llm）

  # LlmGateway 配置（ADR-7）：当前仅使用 sensenova OpenAI 兼容端点
  llm:
    retry:
      max-attempts: 3            # 主模型最多尝试次数（含首次）
      backoff-ms: 1000           # 指数退避初始间隔（毫秒），按 2 倍递增
    fallback-enabled: false      # 禁用备用供应商，仅使用主模型
    # 视觉模型（ADR-11）：基于 GoPlan 端点换 model 即多模态；未配置则图片聊天不可用
    vision-model: mimo-v2.5

  # RAG 查询改写开关（ADR-15）：开启时检索前用 LLM 改写用户查询（每轮多一次 LLM 调用）
  rag:
    query-rewrite:
      enabled: true
    hybrid-search:
      enabled: false        # 混合检索（pg_trgm+RRF），数据量5000+时开启
    # 检索日志是否带相似度分数（默认关：需多一次 embedding 调用；排查检索质量时开）
    log-score: false
    # 检索重排（ADR-15 阶段 4，默认关闭灰度）：开启后每条 RAG 多一次 LLM 调用（v1=主线 LLM 打分）
    # rerank:
    #   enabled: false       # true 时检索窗口扩为 topN=50，postretrieval 重排取 topK=5
    #   top-n: 50
    #   top-k: 5
    #   mode: llm            # llm=主线模型打分；off=关闭
    #   max-candidate-chars: 200

  # Langfuse 可观测（手写 2.x 签名接入，参考 CodeForge）：密钥一律环境变量注入
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    host: ${LANGFUSE_HOST:http://localhost:3000}

  # 编排图能力治理（ADR-19）：agent 节点工具白名单（能力域，逗号分隔）
  orchestration:
    tools:
      agent-allowlist: terminate,retrieval,web,image,weather,date   # 放行 收尾+知识/网络/图片/天气/日期；pdf/download 等副作用面排除
  # 消息加密（ADR-4，Phase 3）：AES-256-GCM 透明加密，主密钥由 APP_MESSAGE_KEY 注入
  encryption:
    enabled: true

  # 情绪刹车片（FR-CORE-02，Phase 4）
  emotion-brake:
    enabled: true
    start-hour: 23
    end-hour: 6

  # 后台调度预算（ADR-20）：后台任务不得与在线请求争抢 LLM 配额。
  # 2026-09-01 实测：后台调度 20 分钟产生 95 次 LLM/embedding 调用（在线仅 1 次），
  # 是 429 与监控刷屏的主因。排查/压测时 master-enabled=false 一键静默。
  # 输出层（2026-09-02）：用户可见流的事件白名单与思考过程策略。
  # reasoning-mode=discard（默认）：思考模型的 reasoning 不发给用户（防推理糊脸）；
  # stream：以 §R§ 前缀行发出（前端按前缀折叠展示为"思考过程"）。
  output:
    reasoning-mode: discard
  scheduler:
    master-enabled: true            # 总开关：false 时所有后台调度跳过
    llm-budget-per-minute: 30       # 每分钟后台共享配额（LLM+embedding 调用数，进程内令牌桶）
    max-run-ms: 60000               # 单轮最长执行时间：超出即结束，剩余候选留待下轮
    idle-backoff:
      threshold: 3                  # 连续 N 轮无候选后开始退避
      max-multiplier: 8             # 退避倍数封顶（x2→x4→x8）
    reflect:                        # 技能反思（ReflectionScheduler）
      enabled: true
      fixed-delay-ms: 300000        # 原硬编码 5 分钟
      batch-limit: 20               # 原硬编码 LIMIT 20
    extract:                        # 记忆萃取（MemoryExtractionScheduler）
      enabled: true
      fixed-delay-ms: 1800000       # 原硬编码 30 分钟
      batch-limit: 10               # 原 BATCH_LIMIT 常量

  # 灰度发布（08 §3）：固定百分位桶，userId hashCode % 100 映射
  # 环境变量 CANARY_PERCENTAGE 覆盖，0=不灰度，100=全量新版本
  canary:
    percentage: 0

  # pgvector 向量数据库配置（用于 RAG 的向量存储和相似度检索）
  pgvector:
    datasource:
      driver-class-name: org.postgresql.Driver        # PostgreSQL JDBC 驱动
      url: jdbc:postgresql://localhost:5432/postgres   # PostgreSQL 连接地址
      username: postgres
      password: ${PGVECTOR_PASSWORD:}                  # 从环境变量读取

  # 速率限制配置（防止用户频繁调用 API）
  rate-limit:
    enabled: false               # 限流暂不启用（登录直接用，2026-08-19 决定）；代码保留，未来收费/防刷时开启
    daily-quota: 5               # 每日每人最多调用次数

  # 对话记忆配置
  memory:
    window-size: 20              # 每次加载的历史消息数量（用于 LLM 上下文窗口控制）
    agent-window-size: 50        # Agent 执行时保留的最大消息数
    strategy: MESSAGE            # 持久化策略：MESSAGE（自建 message 表，Phase 2 真源）
    prompt-version: v1           # System Prompt 版本（随消息落库归因，08 §2.4）

# ======================== Web 服务器配置 ========================
server:
  port: 8088                     # 应用监听端口
  servlet:
    context-path: /api           # 所有 API 的统一前缀（例如 /api/user/login）

# ======================== API 文档配置（Knife4j + SpringDoc） ========================
springdoc:
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI 的访问路径
    tags-sorter: alpha           # 按字母顺序排列 API 分组
    operations-sorter: alpha     # 按字母顺序排列 API 操作
  api-docs:
    path: /v3/api-docs           # OpenAPI 文档 JSON 的访问路径
  group-configs:
    - group: 'default'
      paths-to-match: '/**'      # 生成所有路径的文档
      packages-to-scan: cn.lwx.lwxaiagent.controller  # 只扫描 Controller 包

knife4j:
  enable: true                   # 启用 Knife4j 增强 Swagger UI
  setting:
    language: zh_cn              # Knife4j UI 显示语言为简体中文

# ======================== 日志配置 ========================
logging:
  level:
    # Spring AI 的 SimpleLoggerAdvisor 输出 DEBUG 级别日志
    # 可以看到每次 LLM 调用的请求和响应内容
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug

# ======================== RAG 检索系统配置 ========================
# 检索模式：pgvector（ADR-1 收敛后唯一路径；Milvus + ES 混合检索已移除）
rag:
  type: pgvector

# ======================== 进化系统配置 ========================
# 技能自动演化：从对话中提取优质经验，沉淀为可复用的技能
evolution:
  enabled: true                  # 是否启用进化系统
  idle-timeout-seconds: 7200     # 会话空闲超时时间（2小时），超时后触发反思
  quality-threshold: 5           # 质量阈值：用户评分 >= 此值才会被进化为技能
  extract-delay-seconds: 1800    # 技能提取延迟（30分钟），保证对话内容足够丰富
  skill-top-k: 3                 # 每次检索返回的 Top-K 个最相关技能
  skill-min-score: 0.5           # 技能检索的最低相似度阈值

# ======================== 搜索 API 配置 ========================
# 通用搜索 API Key（如百度搜索、Google Search 等）
search-api:
  api-key: ${SEARCH_API_KEY:}

# 高德地图 API Key（经 MCP 客户端注入给 amap-maps-server）
amap:
  api-key: ${AMAP_MAPS_API_KEY:}

# ======================== MyBatis-Plus 配置 ========================
mybatis-plus:
  configuration:
    # 日志输出使用 SLF4J（会将 SQL 语句打印到日志中，方便调试）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ======================== JWT 配置（多租户认证） ========================
jwt:
  secret: ${JWT_SECRET:}         # JWT 签名密钥（从环境变量读取，必须保密）
  expiration-ms: 86400000        # Token 过期时间：24 小时（24 * 60 * 60 * 1000）

# ======================== 管理端凭证 ========================
# 用于保护管理类接口（/tenant/token 签发、/memory/admin/**）。
# 未配置时管理接口直接拒绝访问（fail-closed），生产环境必须通过 ADMIN_API_KEY 注入。
admin:
  api-key: ${ADMIN_API_KEY:}
