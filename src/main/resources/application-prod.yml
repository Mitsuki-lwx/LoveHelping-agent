# ============================================================
# application-prod.yml —— 生产/容器 profile（2026-09-07 V1 发布）
# 激活：SPRING_PROFILES_ACTIVE=prod（docker-compose 已设，勿再用 local——local 含明文密钥与本地路径）
# 原则：本文件不落任何明文密钥，全部 ${ENV} 注入；默认值仅指向与本地验证一致的公开形态。
# 密钥清单见仓库根 .env.example / docs/10-部署发布.md。
# ============================================================

spring:
  ai:
    # 主链路 LLM（ADR-51：主端点切 DeepSeek 官方，模型只用 deepseek-flash）。
    #
    # 为什么从 OpenRouter 换走（ADR-48 → ADR-51）：
    #   2026-09-27 19:52 的 A 臂把整条三级降级链打穿 —— primary 因当日免费额度耗尽返回 429，
    #   fallback（dashscope）域名不可达，last-resort（bigmodel）返回 400，三级全废，
    #   6/6 轮用户拿到 5000。详见 docs/phase19-deepseek-official/tasks.md §2。
    #
    # DeepSeek 官方实测（2026-09-27）：
    #   GET /models → deepseek-flash（ctx 1048576 / max_output 393216）、deepseek-v4-pro
    #   POST /chat/completions 6 变体（最小 / 流式 / stream_options / max_tokens 32768 /
    #       4095 / temperature）全部 200
    #   ⚠️ deepseek-chat / deepseek-reasoner 不是有效 ID —— 发了也 200，但响应 model
    #      回落成 deepseek-flash（写错不报错，只静默跑成别的模型）
    #   ⚠️ max_tokens 过小时 content 可能为空（推理 token 吃掉预算）→ 会触发
    #      LlmGateway 的 EmptyResponseException 并制造虚假降级
    #
    # base-url 写到域名根即可，completions-path 用框架默认 /v1/chat/completions
    # （DeepSeek 同时接受 /chat/completions 与 /v1/chat/completions，两条均实测 200）。
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:}              # 必填：DeepSeek 官方 key（sk-...）
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-flash}
    # ⚠️ 不覆盖 completions-path：默认 /v1/chat/completions 对 DeepSeek / OpenRouter 都对；
    # 需要别的形状时在 app.llm.providers[].completions-path 上单条指定（ADR-58）。

app:
  llm:
    # ADR-58：供应商列表（顺序即链路顺序，第一条 enabled 的是主链）。
    #   ⚠️ 与全局 spring.ai.openai.* 的区别：这里才是**主链**的来源
    #   （VisionChatClient 仍读 spring.ai.openai.*，那是已知的绕网关路径，见 P3 待办）。
    providers:
      - name: primary
        base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
        api-key: ${OPENAI_API_KEY:}              # 必填：DeepSeek 官方 key（sk-...）
        model: ${OPENAI_MODEL:deepseek-flash}
      # 启用方式：把 enabled 去掉/置 true，并注入对应 key。加供应商不再需要写 Java。
      # - name: cline
      #   enabled: false
      #   base-url: ${CLINE_BASE_URL:https://api.cline.bot/api}
      #   api-key: ${CLINE_API_KEY:}
      #   model: ${CLINE_MODEL:deepseek/deepseek-v4.1-flash}
      #   response-envelope: data                  # 该网关非流式响应带 {data:...} 信封
    # ADR-52：运行时总闸；false 时整条链一级都不走（应急用）。
    #   ⚠️ 代价：当前默认单 provider 无兜底，主链故障时用户直接拿 5000。
    degrade-enabled: ${LLM_DEGRADE_ENABLED:true}

  # ======================== 可观测（生产策略）========================
  # ADR-67：**生产与测试的开法必须不同**（四个维度，见 docs/11 §可观测）。
  # ⛔ 注意：本文件**只能有一个顶层 `app:`** —— 加重复顶层键会让 SnakeYAML 直接启动失败
  #    （2026-09-29 我踩过：`yaml.safe_load` **不报重复键**，所以"结构校验通过"是假绿）。
  langfuse:
    # ⛔ 生产**默认关**：开启 = trace 元数据（**不含原文**，ADR-44）出域到 Langfuse 实例，
    #    属安全/合规决定 → 需登记 `docs/07` §6.1 后再由环境变量显式打开。
    enabled: ${LANGFUSE_ENABLED:false}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    # 本部署的 Langfuse 实例就在**同机** localhost:3000（2026-09-29 实测可收 trace）。
    # ⛔ 只有"应用与 Langfuse 不在同一台机器"时，才必须显式覆盖 —— 那种情况下
    #    指 localhost 会**静默丢全部 span**（没有任何自动化会变红）。
    host: ${LANGFUSE_HOST:http://localhost:3000}
    # 采样见下（生产默认 10%，测试/本地 100%）。
  # ⚠️ 高流量下队列会丢 span（有界队列）：队列/批量按实际量调，别用本地默认值。
  #    app.langfuse.max-queue-size / max-batch-size / schedule-delay-ms

logging:
  level:
    root: INFO
    cn.lwx.lwxaiagent: INFO          # 业务包 INFO（去掉 local 的检索/追踪 DEBUG 噪声）

# trace 导出默认关闭：无 collector 时避免 HttpExporter ERROR 风暴（见 MEMORY Langfuse 教训）。
# 需要链路追踪时：management.tracing.enabled=true + management.otlp.tracing.endpoint=真实 collector
management:
  tracing:
    enabled: ${LANGFUSE_ENABLED:false}
    # ⭐ 生产与测试的关键差别：**采样率**。
    #   本地/测试 = 1.0（要看全每一条，排查单点问题）；
    #   生产 = 0.1（看**分布**就够：延迟/错误/成本的分位数不需要 100% 样本，
    #   而全量会带来队列压力、存储成本与噪声）。要临时抓疑难问题再调高。
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
