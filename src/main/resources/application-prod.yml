# ============================================================
# application-prod.yml —— 生产/容器 profile（2026-09-07 V1 发布）
# 激活：SPRING_PROFILES_ACTIVE=prod（docker-compose 已设，勿再用 local——local 含明文密钥与本地路径）
# 原则：本文件不落任何明文密钥，全部 ${ENV} 注入；默认值仅指向与本地验证一致的公开形态。
# 密钥清单见仓库根 .env.example / docs/10-部署发布.md。
# ============================================================

spring:
  ai:
    # 主链路 LLM（ADR-51：主端点切 DeepSeek 官方，模型只用 deepseek-flash）。
    #
    # 为什么从 OpenRouter 换走（ADR-48 → ADR-51）：
    #   2026-09-27 19:52 的 A 臂把整条三级降级链打穿 —— primary 因当日免费额度耗尽返回 429，
    #   fallback（dashscope）域名不可达，last-resort（bigmodel）返回 400，三级全废，
    #   6/6 轮用户拿到 5000。详见 docs/phase19-deepseek-official/tasks.md §2。
    #
    # DeepSeek 官方实测（2026-09-27）：
    #   GET /models → deepseek-flash（ctx 1048576 / max_output 393216）、deepseek-v4-pro
    #   POST /chat/completions 6 变体（最小 / 流式 / stream_options / max_tokens 32768 /
    #       4095 / temperature）全部 200
    #   ⚠️ deepseek-chat / deepseek-reasoner 不是有效 ID —— 发了也 200，但响应 model
    #      回落成 deepseek-flash（写错不报错，只静默跑成别的模型）
    #   ⚠️ max_tokens 过小时 content 可能为空（推理 token 吃掉预算）→ 会触发
    #      LlmGateway 的 EmptyResponseException 并制造虚假降级
    #
    # base-url 写到域名根即可，completions-path 用框架默认 /v1/chat/completions
    # （DeepSeek 同时接受 /chat/completions 与 /v1/chat/completions，两条均实测 200）。
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${OPENAI_API_KEY:}              # 必填：DeepSeek 官方 key（sk-...）
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-flash}
    # ⚠️ 不覆盖 completions-path：那是为 bigmodel 的 /api/paas/v4 形态设的，
    # 对 DeepSeek / OpenRouter 都会拼出错误路径。
    # bigmodel 兜底级（现已默认关闭）的路径在 BigModelLastResortConfig 里单独指定。

app:
  llm:
    # ADR-51：两级降级目标实测都不可用（dashscope 域名不可达 / bigmodel 400），
    # 故默认全关，链路退化为「主链 + 重试」。置 true 即开关式恢复，无需改代码。
    # ⚠️ 代价：单 provider 无兜底。
    fallback-enabled: ${LLM_FALLBACK_ENABLED:false}
    last-resort-enabled: ${LLM_LAST_RESORT_ENABLED:false}

logging:
  level:
    root: INFO
    cn.lwx.lwxaiagent: INFO          # 业务包 INFO（去掉 local 的检索/追踪 DEBUG 噪声）

# trace 导出默认关闭：无 collector 时避免 HttpExporter ERROR 风暴（见 MEMORY Langfuse 教训）。
# 需要链路追踪时：management.tracing.enabled=true + management.otlp.tracing.endpoint=真实 collector
management:
  tracing:
    enabled: ${LANGFUSE_ENABLED:false}
