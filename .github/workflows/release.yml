# ============================================================
# CD：打 tag（v1.0.0）→ 构建双镜像 → 推送 GHCR → （可选）服务器自动部署
# 触发：git tag v1.0.0 && git push origin v1.0.0
# 服务器部署需先配置仓库 Secrets：DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY，
# 且在服务器预置 /opt/lovehelping/{docker-compose.yml,.env}（见 docs/10 §4 CD）
# ============================================================
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag metadata
        id: meta
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"
          echo "publishing tag: ${TAG:-latest}"

      - name: Build & push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lovehelping:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/lovehelping:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push mcp-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lovehelping-mcp:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/lovehelping-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-push
    # 配置了 DEPLOY_HOST 才执行（否则只发布镜像，人工部署）
    if: ${{ secrets.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/lovehelping
            TAG=${{ needs.build-push.outputs.tag }} docker compose pull
            TAG=${{ needs.build-push.outputs.tag }} docker compose up -d
            docker image prune -f
