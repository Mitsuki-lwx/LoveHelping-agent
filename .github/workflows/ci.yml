# ============================================================
# CI（2026-09-07）：后端单测 + 全链路 E2E 冒烟（有 LLM secrets 才跑）
# 安全扫描见 security.yml（gitleaks 全历史）
# 注意：secrets 上下文不可用于 job 级 if——E2E 的开关放在 gate step 里（step 级 if 合法）
# ============================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- 后端单测（纯逻辑，零外部依赖，必跑必绿）----
  backend-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run unit tests
        run: ./mvnw -B test
        env:
          OPENAI_API_KEY: dummy-for-context-test
          DASHSCOPE_API_KEY: dummy-for-context-test

  # ---- 集成测试层（Testcontainers，ADR-69）：真容器跑**迁移链/约束/向量栈契约** ----
  # 为什么单列：`mvn test` 的 48 个类**全是 Mockito 单测**，SQL/约束/迁移从没被真执行过
  # （ADR-46 那类"载荷契约"事故正是这层盲区）。用 failsafe 与单测分离：
  # Docker 缺失时这些用例**跳过而不是假绿**（disabledWithoutDocker）。
  # 不需要任何 secrets —— 纯容器 + 迁移脚本。
  integration-test:
    name: Integration Tests (Testcontainers)
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # `verify` = 单测 + 集成测试(failsafe) + **覆盖率门槛(jacoco:check)** —— 三者缺一不算过
      - name: Run integration tests + coverage gate
        run: ./mvnw -B verify

  # ---- 全链路 E2E（ADR-68：与本地同一套 —— e2e_live.py 27 项 + 附加断言 + 输出侧探针）----
  # 需要真实 LLM secrets（模型调用无法 mock）——secrets 未配置时 gate step
  # 置 skip=true，其余步骤全部跳过，job 依然绿；配置后每次 push 即全链路回归。
  e2e-smoke:
    name: E2E (shared suite, 21 + assertions)
    needs: backend-test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-pwd
          MYSQL_DATABASE: agentdb
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-pwd"
          --health-interval 10s --health-timeout 5s --health-retries 20
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-pg-pwd
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 0) 闸门：LLM secrets 缺失时跳过后续所有步骤（step 级 if 可用 secrets）
      - name: Gate - check LLM key
        id: gate
        run: |
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "LLM secrets 未配置，E2E 冒烟跳过（配置 Secrets 后自动恢复全链路回归）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "LLM secrets 已配置，继续全链路 E2E"
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 1) 构建两个可执行 jar（主应用 + mcp-server 工具面）
      - name: Build jars
        if: steps.gate.outputs.skip != 'true'
        run: |
          ./mvnw -B package -DskipTests
          ./mvnw -B -f mcp-server/pom.xml package -DskipTests

      # 2) 起 mcp-server（主应用启动需连 MCP）
      - name: Start mcp-server
        if: steps.gate.outputs.skip != 'true'
        run: |
          java -jar mcp-server/target/mcp-server-0.0.1-SNAPSHOT.jar --server.port=8125 > mcp.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null -m 2 http://localhost:8125/ && break || sleep 2
          done

      # 2.5) 启用 pgvector 扩展（全新容器默认未启用，INSERT vector 类型会报 Unknown type）
      - name: Enable pgvector extension
        if: steps.gate.outputs.skip != 'true'
        run: |
          PGPID=$(docker ps -q --filter ancestor=pgvector/pgvector:pg16)
          echo "pg container: $PGPID"
          docker exec "$PGPID" psql -U postgres -c "
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";
          CREATE TABLE IF NOT EXISTS public.vector_store (
            id uuid DEFAULT uuid_generate_v4() PRIMARY KEY,
            content text,
            metadata jsonb,
            embedding vector(1024)
          );
          CREATE INDEX IF NOT EXISTS spring_ai_vector_index
            ON public.vector_store USING hnsw (embedding vector_cosine_ops);"

      # 3) 起主应用（prod profile：首次启动自动 Flyway + PG 向量化，需几分钟）
      - name: Start app
        if: steps.gate.outputs.skip != 'true'
        env:
          SPRING_PROFILES_ACTIVE: prod
          MYSQL_PASSWORD: ci-mysql-pwd
          PGVECTOR_PASSWORD: ci-pg-pwd
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_API_KEY: smoke-test-admin-key
          MCP_SERVER_URL: http://localhost:8125/mcp
          # phase33 ③：刹车片用例需要深夜时段；装置强制 0-24（恒真），非生产值
          APP_EMOTION_BRAKE_START_HOUR: "0"
          APP_EMOTION_BRAKE_END_HOUR: "24"
        run: |
          java -jar target/lwx-ai-agent-0.0.1-SNAPSHOT.jar --server.port=8088 > app.log 2>&1 &
          for i in $(seq 1 150); do
            curl -s -m 3 http://localhost:8088/api/actuator/health | grep -q '"status":"UP"' && break || sleep 4
          done
          curl -s -m 5 http://localhost:8088/api/actuator/health

      # 4) E2E（ADR-68 收敛：与本地**同一套**实现，不再各有一套）
      #    ⛔ 此前 CI 跑 `scripts/e2e-smoke.sh`（12 项 bash）、本地跑 `e2e_live.py`（21 项）+ 附加断言
      #      → **两扇门给出不同答案**（CI 缺 Agent/记忆/沙盘/三牌/护栏）。那是流程级缺陷，不是覆盖取舍。
      #    现在：e2e_live.py（21 项）+ e2e_assertions.py（A3/A4/A5/B/D/E）+ probe_l3_stream.py（A6）。
      - name: Run E2E suite
        if: steps.gate.outputs.skip != 'true'
        env:
          # 三个脚本都只用 --base/--output，不读 env —— 此处只提供「期望值」用于对照
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set -e
          BASE=http://localhost:8088/api
          mkdir -p outputs
          python3 scripts/e2e_live.py --base "$BASE" --output outputs/e2e-ci.json
          python3 scripts/e2e_assertions.py \
            --base "$BASE" --log app.log --prometheus "$BASE/actuator/prometheus" \
            --expect-primary-base "${OPENAI_BASE_URL:-https://api.deepseek.com}" \
            --expect-primary-model "${OPENAI_MODEL:-deepseek-flash}" \
            --output outputs/e2e-assertions-ci.json
          python3 scripts/probe_l3_stream.py --base "$BASE" --repeat 2 --output outputs/l3-ci.json

      # 5) 失败即吐日志（省得再拉）
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            app.log
            mcp.log
